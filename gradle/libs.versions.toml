[versions]
agp                  = "8.5.2"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.27"
hilt                 = "2.52"
compose-bom          = "2024.11.00"
activity-compose     = "1.9.3"
navigation-compose   = "2.8.4"
datastore            = "1.1.1"
coroutines           = "1.9.0"
commonmark           = "0.23.0"
coil                 = "2.7.0"
lifecycle            = "2.8.7"

[libraries]
# Compose BOM
compose-bom                  = { group = "androidx.compose", name = "compose-bom",        version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons       = { group = "androidx.compose.material", name = "material-icons-extended" }

# Activity / Navigation
activity-compose             = { group = "androidx.activity", name = "activity-compose",  version.ref = "activity-compose" }
navigation-compose           = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Lifecycle / ViewModel
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Hilt
hilt-android                 = { group = "com.google.dagger", name = "hilt-android",      version.ref = "hilt" }
hilt-compiler                = { group = "com.google.dagger", name = "hilt-compiler",     version.ref = "hilt" }
hilt-navigation-compose      = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# DataStore
datastore-preferences        = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Markdown
commonmark                   = { group = "org.commonmark", name = "commonmark",            version.ref = "commonmark" }
commonmark-gfm               = { group = "org.commonmark", name = "commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-strikethrough     = { group = "org.commonmark", name = "commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-tasklist          = { group = "org.commonmark", name = "commonmark-ext-task-list-items", version.ref = "commonmark" }
commonmark-autolink          = { group = "org.commonmark", name = "commonmark-ext-autolink", version.ref = "commonmark" }

# Coil (image loading)
coil-compose                 = { group = "io.coil-kt", name = "coil-compose",             version.ref = "coil" }

# Test
junit                        = { group = "junit", name = "junit",                         version = "4.13.2" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application",         version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
